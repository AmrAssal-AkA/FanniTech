name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup environment:
    name: Setup Environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm install

  server tests:
    name: Run nestjs server tests
    runs-on: ubuntu-latest
    needs: setup environment
    defaults:
      run:
        working-directory: ./server

      steps:
        - name: test server
          run: npm run test

        - name: test endToEnd
          run: npm run test:e2e

        - name: test coverage
          run: npm run test:cov

        - name: test lint
          run: npm run lint

        - name: test build
          run: npm run build

  mobile-test:
    name: Run Mobile Tests
    runs-on: ubuntu-latest
    needs:
      - setup environment
      - server tests
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: test mobile
        run: npm run test

      - name: test coverage
        run: npm run test:cov

      - name: test typeCheck
        run: npm run typeCheck

      - name: test build
        run: npx expo prebuild && npx expo build:android --no-wait

  web-test:
    name: Run Web Tests
    runs-on: ubuntu-latest
    needs:
      - setup environment
      - server tests
      - mobile-test

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: run lint
        run: npm run lint

      - name: run web build
        run: npm run build
