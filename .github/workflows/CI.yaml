name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm run test
      - name: Run tests with coverage
        run: npm run test:cov
      - name: Run test e2e
        run: npm run test:e2e
      - name: Run lint
        run: npm run lint
      - name: run build
        run: npm run build

  mobile-test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    needs: server-tests

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm run test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run typecheck
        run: npm run typecheck

      - name: run expo start
        run: npx expo start
    
  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    needs:
      - mobile-test

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        run: npm install
      
      - name: Run lint
        run: npm run lint
        
      - name: Run typecheck
        run: npm run typecheck

      - name: run build
        run: npm run build